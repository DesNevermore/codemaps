# Default config for ProgramBench inference.

agent:
  wall_time_limit_seconds: 21600
  system_template: |
    You are a helpful assistant that can interact with a computer.

    This is a reverse-engineering benchmark. You are given a compiled binary and its documentation.
    Your job is to write a new, original codebase from scratch that produces an executable with identical behavior.
    You must figure out the behavior solely by running and interacting with the provided binary.
    Writing original code based on observed behavior is the entire point of this benchmark.

    Any approach that shortcuts this — finding existing source code, wrapping the binary,
    or installing the original tool — does not count as a solution. It will be detected by an
    automated judge, marked as a disqualification, and scored as a failure.
    The trace will be posted to an online wall of shame.

    <RULES>
    ## What is not allowed

    ### 1. Obtaining source code

    The only source of truth about what the executable does is the executable itself and its
    bundled documentation. You must not search the internet, package registries, or any external
    source for information about this project's source code. Even if you recognize what the
    executable is, you must reimplement it from behavioral observation alone.

    This includes but is not limited to:
    - Cloning or browsing the original GitHub repository, its forks, or mirrors
    - Downloading the project from package registries: `cargo install <project>`, `go get github.com/<org>/<project>`, `pip install <project>`, `apt-get source <project>`, `npm install <project>`, etc.
    - Fetching source tarballs from project websites (e.g., `curl https://lua.org/ftp/lua-5.5.0.tar.gz`)
    - Using a package manager to download the project as a dependency and then reading its cached source (e.g., navigating into `~/.cargo/registry/src/` or `$(go env GOPATH)/pkg/mod/`)
    - Searching the web for the project's source code or implementation details

    ### 2. Wrapping or reusing the original binary

    Your submission must be a genuine reimplementation. The provided `./executable` is for
    observation only — your final solution must not depend on it or any other pre-built version
    of the same tool at runtime.

    This includes but is not limited to:
    - Writing a wrapper script that delegates to the original binary (e.g., `exec zstd "$@"`)
    - Installing the tool from a package manager and shimming to it (e.g., `apt-get install nnn && cp $(which nnn) ./executable`)
    - Writing a `compile.sh` that simply makes the provided binary executable (`chmod +x ./executable`) or copies it (`cp ./executable ./executable`)
    - Building a binary whose main function shells out to an external tool (e.g., `Command::new("miniserve").args(args).exec()`)
    - Re-linking prebuilt `.o` object files found in the workspace without writing new source code

    ### 3. Binary analysis of the provided executable

    All information about the provided `./executable` must be obtained by interacting with it
    through its normal user interface (CLI flags, stdin/stdout, etc.).
    - You MUST NOT decompile `./executable` or use disassemblers (objdump, Ghidra, etc.) on it
    - You MUST NOT use strace, ltrace, or similar tracing/instrumentation tools on `./executable`

    Note: this restriction applies ONLY to the provided `./executable`. You are free to use any
    analysis tools on binaries that you produce yourself during development.

    ## What IS allowed

    - Running the executable with any inputs, flags, and arguments to observe its behavior
    - Reading any documentation files bundled in the workspace
    </RULES>
  instance_template: |
    ## Task context

    We want to elicit a precise BEHAVIORAL SPECIFICATION for a given executable.
    The executable is located at `./executable` in the workspace root.

    You also have access to the existing documentation.

    ## Your task

    Do NOT write an implementation. Your ONLY deliverable is a specification file
    `/workspace/SPEC.md` describing the observable behavior of `./executable`.

    The documentation describes only the surface of this program: primary features, typical
    usage, representative examples. It is ambiguous or silent on edge cases, output formats,
    and error behavior. Your job is to close that gap by systematically PROBING the binary
    and recording what you observe.

    Probe deliberately along these four axes, which is where documentation is characteristically
    incomplete:

    - **Boundary probing**: inputs at the limits of accepted ranges (empty input, very long
      strings, special characters, zero/negative numbers) to pin down exact boundary semantics.
    - **Error-path elicitation**: systematically trigger error conditions (malformed input,
      missing required arguments, conflicting flags) and record the precise `stderr` text and
      exit code each one produces.
    - **Combinatorial flag testing**: exercise flags in combination to surface interaction
      effects that per-flag documentation never states.
    - **Output-format refinement**: feed adjacent inputs and compare outputs to resolve field
      ordering, delimiter choice, padding and whitespace handling exactly.

    Write `/workspace/SPEC.md` using EXACTLY these six section headings:

    ```
    ## Overview
    ## Flags
    ## Input & stdin
    ## Output format
    ## Error patterns
    ## Edge cases
    ```

    These headings prescribe WHAT to document, not how to discover or phrase it. Record concrete
    observed evidence — real command lines, real output, real exit codes — not guesses. If you did
    not verify something, say so explicitly rather than inventing it. A later agent will implement
    this program using ONLY your SPEC.md as its behavioral reference, so anything you omit is
    likely to be implemented wrong.

    Be thorough: a specification that covers every subcommand, flag, and error path is worth far
    more than a short one. Keep probing until further probes stop revealing new behavior.

    When `/workspace/SPEC.md` is complete, submit by issuing exactly:
    `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`

    ## Command Execution Rules

    You can execute bash commands and edit files to implement the necessary changes.

    You are operating in an environment where

    1. You issue at least one command
    2. The system executes the command(s) in a subshell
    3. You see the result(s)
    4. You write your next command(s)

    Each response should include:

    1. **Reasoning text** where you explain your analysis and plan
    2. At least one tool call with your command

    **CRITICAL REQUIREMENTS:**

    - Your response SHOULD include reasoning text explaining what you're doing
    - Your response MUST include AT LEAST ONE bash tool call
    - Directory or environment variable changes are not persistent. Every action is executed in a new subshell.
    - However, you can prefix any action with `MY_ENV_VAR=MY_VALUE cd /path/to/working/dir && ...` or write/load environment variables from files
    - Submit your changes and finish your work by issuing the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`.
      Do not combine it with any other command. <important>After this command, you cannot continue working on this task.</important>

    Example of a CORRECT response:
    <example_response>
    I need to understand the structure of the repository first. Let me check what files are in the current directory to get a better understanding of the codebase.

    [Makes bash tool call with {"command": "ls -la"} as arguments]
    </example_response>

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>

    ## Useful command examples

    python is available as python3

    ### Create a new file:

    ```bash
    cat <<'EOF' > newfile.py
    import numpy as np
    hello = "world"
    print(hello)
    EOF
    ```

    ### Edit files with sed:

    ```bash
    # Replace all occurrences
    sed -i 's/old_string/new_string/g' filename.py

    # Replace only first occurrence
    sed -i 's/old_string/new_string/' filename.py

    # Replace first occurrence on line 1
    sed -i '1s/old_string/new_string/' filename.py

    # Replace all occurrences in lines 1-10
    sed -i '1,10s/old_string/new_string/g' filename.py
    ```

    ### View file content:

    ```bash
    # View specific lines with numbers
    nl -ba filename.py | sed -n '10,20p'
    ```

    ### Any other command you want to run

    ```bash
    anything
    ```
  # gpt-5.4-mini ends its work with a PLAIN-TEXT summary and no tool call (verified by replaying a
  # failing conversation: finish_reason=stop, tool_calls=false, 117 completion tokens, 0 reasoning).
  # mini-swe's protocol requires >=1 bash call per reply, so the stock threshold of 3 aborted 50% of
  # baseline runs as RepeatedFormatError after ~8 turns. deepseek never does this (360/360 Submitted),
  # so this is model behaviour, not a harness bug. 10 gives the nudge template more chances to steer
  # it back to a tool call. MUST be identical in both arms: the damage was uneven (50% vs 19%) and
  # baseline suffered more, so leaving it unequal would inflate SpecFirst's apparent advantage.
  max_consecutive_format_errors: 10
  step_limit: 1000
  cost_limit: 15
environment:
  environment_class: "docker"
  cwd: "/workspace"
  timeout: 180
  container_timeout: "7h"
  run_args:
    - "--rm"
    - "--network"
    - "none"
    - "--cpus"
    - "20"
    - "--memory"
    - "60g"
    - "--memory-swap"
    - "60g"
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 10000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
    The output of your last command was too long.
    Please try a different command that produces less output.
    If you're looking at a file you can try use head, tail or sed to view a smaller number of lines selectively.
    If you're using grep or find and it produced too much output, you can use a more selective search pattern.
    If you really need to see something from the full command's output, you can redirect output to a file and then search in that file.
    </warning>
    {%- set elided_chars = output.output | length - 10000 -%}
    <output_head>
    {{ output.output[:5000] }}
    </output_head>
    <elided_chars>
    {{ elided_chars }} characters elided
    </elided_chars>
    <output_tail>
    {{ output.output[-5000:] }}
    </output_tail>
    {%- endif -%}
    {% if step_limit > 0 and step_limit - n_model_calls < 20 -%}

    <IMPORTANT>
    There is a limit to the steps you can take. You are now {{ step_limit - n_model_calls }} steps away from reaching your limit. After you reach your limit, you will not be able to continue working.
    At this point, please abort any specific probing or debugging and make sure that
    1. `/workspace/SPEC.md` exists and uses all six required headings (it is okay if some behavior is still unknown)
    2. Any known limitations or unverified behavior are recorded in `/workspace/SPEC.md`
    3. You submit with `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
    </IMPORTANT>
    {%- endif %}
    {% if wall_time_limit_seconds > 0 and wall_time_limit_seconds - elapsed_seconds < 600 -%}

    <IMPORTANT>
    You are running low on time. You have approximately {{ ((wall_time_limit_seconds - elapsed_seconds) / 60) | int }} minutes remaining before timeout.
    Please stop probing and wrap up your specification now:
    1. Ensure `/workspace/SPEC.md` exists and uses all six required headings (it is okay if some behavior is still unknown)
    2. Record any known limitations or unverified behavior in `/workspace/SPEC.md`
    3. Submit with `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
    </IMPORTANT>
    {%- endif %}
  format_error_template: |
    {% if finish_reason is defined and finish_reason in ["length", "tool_calls"] -%}
    Your previous response reached the output token limit (finish_reason={{ finish_reason }}) before you produced a tool call, so it was cut off. Respond more concisely and finish with exactly one bash tool call. If you need to think more, do so briefly.
    {%- else -%}
    Tool call error:

    <error>
    {{error}}
    </error>

    Here is general guidance on how to submit correct toolcalls:

    Every response needs to use the 'bash' tool at least once to execute commands.

    Call the bash tool with your command as the argument:
    - Tool: bash
    - Arguments: {"command": "your_command_here"}

    If you have completed your assignment, please consult the first message about how to
    submit your solution (you will not be able to continue working on this task after that).
    {%- endif %}
